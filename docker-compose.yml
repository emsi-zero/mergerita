# Local stack: PostgreSQL, the orchestrator (web + worker) and the mock GitLab.
#
#   docker compose up --build            # migrate, then web, worker and gitlab-mock
#   docker compose run --rm tests        # the test suite against the compose database
#
# Behind a network that cannot reach Docker Hub, point the two images at a mirror:
#   POSTGRES_IMAGE=registry.example.com/library/postgres:16 \
#   PYTHON_IMAGE=registry.example.com/library/python:3.12-slim docker compose up --build

x-app: &app
  build:
    context: .
    # Build on the host network: on some machines containers on the default bridge
    # have no DNS, so pip cannot reach PyPI. Only the build needs the internet.
    network: host
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  image: merge-orchestrator:dev
  environment: &app-env
    DEBUG: "1"
    ALLOWED_HOSTS: "*"
    DB_HOST: db
    DB_NAME: orchestrator
    DB_USER: orchestrator
    DB_PASSWORD: orchestrator
    GITLAB_WEBHOOK_TOKEN: dev-token
    RMO_GITLAB_GATEWAY: integrations.gitlab.GitLabRestGateway
    GITLAB_URL: http://gitlab-mock:8080
    GITLAB_TOKEN: mock-token
    RMO_AI_REVIEWER_GITLAB_USER_ID: "90"
    RMO_GITLAB_PROJECT_IDS: "7"
  volumes:
    - .:/app

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: python manage.py run_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      gitlab-mock:
        condition: service_started

  gitlab-mock:
    <<: *app
    command: >
      python scripts/gitlab-mock serve --host 0.0.0.0 --port 8080 --token mock-token
      --webhook-url http://web:8000/webhooks/gitlab/ --webhook-secret dev-token
    ports:
      - "${MOCK_PORT:-8080}:8080"

  tests:
    <<: *app
    # Tests choose their own gateway and GitLab settings, so they get only the database.
    environment:
      DEBUG: "1"
      DB_HOST: db
      DB_NAME: orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
    command: python -m pytest -q
    profiles: ["tests"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

# An explicit subnet, so the stack does not need a free range from Docker's default
# address pools (they can be used up by VPN routes or many old networks).
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.252.10.0/24}
