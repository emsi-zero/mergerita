services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DB_HOST: db
      DB_NAME: orchestrator
      DB_USER: orchestrator
      DB_PASSWORD: orchestrator
      GITLAB_WEBHOOK_TOKEN: dev-token
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
